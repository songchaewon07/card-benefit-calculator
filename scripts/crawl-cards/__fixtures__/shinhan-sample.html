<!--
  신한카드 실제 카드 상세페이지(2026-08-19 기준, Deep Dream 체크)에서 발췌한
  구조 샘플. 이 카드는 체크카드라 연회비 표가 없고(연회비 0원 추정), 통합
  적립한도 표만 실제 <table>로 존재한다.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
  <title>신한카드 Deep Dream 체크 (미니언즈) | 카드 | 신한카드</title>
</head>
<body>
  <div class="shc-table__container">
    <table class="shc-table">
      <caption>전월 이용금액(일시불+할부),모두드림 적립한도,더해드림+챙겨드림 월 통합 적립한도 로 구성된 표입니다.</caption>
      <thead>
        <tr>
          <th scope="col">전월 이용금액 (일시불+할부)</th>
          <th scope="col">모두드림 적립한도</th>
          <th scope="col">더해드림+챙겨드림 월 통합 적립한도</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>20만원 이상 40만원 미만</td>
          <td rowspan="3">적립제한 없이</td>
          <td>5천 포인트</td>
        </tr>
        <tr>
          <td>40만원 이상 80만원 미만</td>
          <td>1만 5천 포인트</td>
        </tr>
        <tr>
          <td>80만원 이상</td>
          <td>3만 포인트</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
